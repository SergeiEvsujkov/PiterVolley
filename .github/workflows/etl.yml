name: ETL

on:
  schedule:
    # каждые 6 часов: 03:00, 09:00, 15:00, 21:00 по Москве (UTC+3)
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etl
  cancel-in-progress: false

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openpyxl lxml

      - name: Collect data
        run: python etl/etl.py --refresh

      - name: Validate data
        run: python etl/validate.py

      - name: Publish to GitHub Pages folder
        run: |
          mkdir -p docs
          cp etl/out/data.json docs/data.json

      - name: Commit changes
        run: |
          git config user.name "piter-volley-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "data unchanged"
          else
            git commit -m "data: $(date -u +%FT%TZ)"
            git push
          fi
