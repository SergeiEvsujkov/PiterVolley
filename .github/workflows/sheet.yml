name: Sheet retry

on:
  schedule:
    # каждые 10 минут: догоняем таблицу, если её не было при основной сборке
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etl
  cancel-in-progress: false

jobs:
  retry-sheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openpyxl

      - name: Catch up schedule sheet
        run: python etl/sheet_retry.py

      - name: Commit changes
        run: |
          git config user.name "piter-volley-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "data unchanged"
          else
            git commit -m "sheet: $(date -u +%FT%TZ)"
            git push
          fi
